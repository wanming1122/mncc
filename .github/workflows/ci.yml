name: CI

on: [push, pull_request]

permissions:
  issues: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        id: pytest
        run: python -m pytest -q --tb=short
        continue-on-error: true
      - name: Report pytest failure to issue
        if: steps.pytest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=$(python -m pytest -q --tb=long 2>&1)
          STATUS=$?
          gh issue create --title "CI pytest failure $(date -u +%Y%m%d-%H%M%S)" \
            --body "exit=$STATUS

\`\`\`
$OUT
\`\`\`"
      - name: Fail on pytest errors
        if: steps.pytest.outcome == 'failure'
        run: exit 1
      - name: Bench mock smoke
        run: python bench/runner.py --mode mock
