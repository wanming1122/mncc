name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        id: pytest
        run: python -m pytest -q --tb=short
        continue-on-error: true
      - name: Emit failure summary
        if: steps.pytest.outcome == 'failure'
        run: |
          python -m pytest -q --tb=short 2>&1 | tail -80
          python -m pytest -q --tb=short 2>&1 | tail -80 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Fail on pytest errors
        if: steps.pytest.outcome == 'failure'
        run: exit 1
      - name: Bench mock smoke
        run: python bench/runner.py --mode mock
